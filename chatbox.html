<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
}

    /* Floating Chat Icon */
.chat-icon {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: white;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: 0.3s;
    z-index: 1001;
}

.chat-icon:hover {
    transform: scale(1.1);
}

/* Chat Container */
.chat-container {
    width: 400px;
    height: 600px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    flex-direction: column;
    overflow: hidden;

    position: fixed;
    bottom: 90px;
    right: 20px;
    z-index: 1000;
}

/* Header */
.chat-header {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: white;
    padding: 20px;
    text-align: center;
    font-weight: 600;
    font-size: 18px;
    position: relative;
}

/* Chat Messages */
.chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f5f7fb;
}

/* Message Bubble */
.message {
    margin: 10px 0;
    padding: 10px 15px;
    border-radius: 15px;
    max-width: 75%;
    animation: fadeIn 0.3s ease-in-out;
}

.user {
    background: #6a11cb;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 0;
}

.bot {
    background: #e4e6eb;
    color: black;
    margin-right: auto;
    border-bottom-left-radius: 0;
}

/* Input Section */
.chat-input {
    display: flex;
    padding: 15px;
    background: white;
    border-top: 1px solid #ddd;
}

.chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 14px;
}

.chat-input button {
    margin-left: 10px;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #6a11cb;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.chat-input button:hover {
    background: #2575fc;
}

/* Animation */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(5px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>


  

<div class="chat-container">

<div class="chat-header">
    📘 Exam Preparation Assistant
    <span style="position:absolute; right:20px; cursor:pointer;" onclick="toggleChat()">✖</span>
</div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot">Hello 👋 Ask me your study doubts!</div>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type your question...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
function toggleChat() {
    let chatBox = document.querySelector(".chat-container");

    if (chatBox.style.display === "flex") {
        chatBox.style.display = "none";
    } else {
        chatBox.style.display = "flex";
    }
}
</script>

</body>
</html>

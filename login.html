<!DOCTYPE html>
<html>
<head>
<title>ML Department Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f4f7fb;
}

.login-box{
  width:350px;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
  color:#2c3e50;
}

input, select{
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:5px;
  font-size:14px;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:5px;
  background:#2c3e50;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#34495e;
}

.error{
  color:red;
  text-align:center;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>ML Department Login</h2>

  <form onsubmit="loginUser(); return false;">
    <select id="role" required>
      <option value="">Select Role</option>
      <option value="student">Student</option>
      <option value="faculty">Faculty</option>
      <option value="admin">Admin</option>
    </select>

    <input type="text" id="username" placeholder="Enter Name" required>
    <input type="password" id="password" placeholder="Enter Password" required>

    <button type="submit">Login</button>
  </form>

  <div class="error" id="errorMsg"></div>
</div>

<script>
function loginUser(){

  let role = document.getElementById("role").value;
  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value.trim();

  if(role === ""){
    document.getElementById("errorMsg").innerText = "Please select a role";
    return;
  }

  if(username === "" || password === ""){
    document.getElementById("errorMsg").innerText = "Please fill all fields";
    return;
  }

  // Accept any username & password
  localStorage.setItem("role", role);
  localStorage.setItem("username", username);

  window.location.href = "index.html";
}
</script>

</body>
</html>
